name: CI

# Builds the solution and runs the tests on every pull request to master and on every push to master.
# The tests need Windows (WinForms and the LibVLC natives). The tests against the real YouTube are
# skipped: they only run with YTP_INTEGRATION_TESTS=1, which is not set here.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A new push to the same branch or pull request cancels the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore YoutubeVideoPlayer.slnx

      - name: Build
        run: dotnet build YoutubeVideoPlayer.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test YoutubeVideoPlayer.Tests/YoutubeVideoPlayer.Tests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore
